# Creative Loop — entorno local completo.
#
#   docker compose up -d --build     levanta todo
#   docker compose logs -f app       logs de la web
#   docker compose down              para todo (los datos se conservan)
#   docker compose down -v           para todo y BORRA los datos
#
# La web queda en http://localhost:${APP_PORT:-3100}
# Consola de MinIO en http://localhost:${MINIO_CONSOLE_PORT:-9001}

name: creative-loop

x-app: &app
  build:
    context: .
    target: dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-creative}:${POSTGRES_PASSWORD:-creative}@postgres:5432/${POSTGRES_DB:-creative_loop}
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://minio:9000
    TRANSCRIBER_URL: http://transcriber:8000
  volumes:
    - ./:/app
    - app_node_modules:/app/node_modules
    - app_next:/app/.next
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  app:
    <<: *app
    command: sh -c "npm run db:deploy && npm run db:seed && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${APP_PORT:-3100}:3000"

  worker:
    <<: *app
    command: sh -c "npm run db:generate && npm run worker"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Extractor de guion (faster-whisper). Sin puerto publicado: solo la app lo alcanza.
  # No guarda nada: los archivos temporales se borran al terminar cada petición.
  transcriber:
    build: ./transcriber
    restart: unless-stopped
    environment:
      MAX_SCRIPT_MB: ${MAX_SCRIPT_MB:-500}
      MAX_SCRIPT_MINUTES: ${MAX_SCRIPT_MINUTES:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creative}
      POSTGRES_DB: ${POSTGRES_DB:-creative_loop}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creative} -d ${POSTGRES_DB:-creative_loop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6385}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      # El navegador sube directo a MinIO: CORS abierto solo en local.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea los buckets y termina.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID:-minioadmin} $${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/$${S3_BUCKET_ORIGINALS:-creative-originals} &&
      mc mb --ignore-existing local/$${S3_BUCKET_DERIVED:-creative-derived} &&
      echo buckets listos
      "
    env_file: .env

volumes:
  postgres_data:
  redis_data:
  minio_data:
  app_node_modules:
  app_next:
